# Runs on every push and pull request: install exactly the locked packages, run the 72 tests,
# and check that the React app still builds. A red ❌ on GitHub means: do not merge yet.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
